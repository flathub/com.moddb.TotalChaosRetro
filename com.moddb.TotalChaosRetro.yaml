app-id: com.moddb.TotalChaosRetro
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: totalchaos.sh
finish-args:
  - --device=all
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Audio
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
cleanup:
  - /include
  - /lib/*.a
  - /lib/*.la
  - /lib*/cmake
  - /lib*/pkgconfig
  - /lib*/source
  - /lib*/debug
  - /share/doc
  - /share/man
  - /share/help
modules:
  - shared-modules/linux-audio/libinstpatch.json
  - shared-modules/linux-audio/fluidsynth2.json

  - name: uzdoom
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_CXX_FLAGS=-DSHARE_DIR=\"/app/share\"
      - -DBUILD_FLATPAK=ON
    sources:
      - type: git
        url: https://github.com/UZDoom/UZDoom
        tag: 5.0.1
        commit: b92a83674b76c295a51c2ca21ee9b3085526fecb
        disable-shallow-clone: true
        x-checker-data:
          type: git
          version-scheme: semantic

  - name: freedoom2
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/freedoom/freedoom/releases/download/v0.12.1/freedoom-0.12.1.zip
        sha256: f42c6810fc89b0282de1466c2c9c7c9818031a8d556256a6db1b69f6a77b5806
    build-commands:
      - install -Dm 644 freedoom2.wad -t /app/share/games/uzdoom

  - name: totalchaos-retro
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/mbugni/totalchaos-gamedata/releases/download/v1.40.0/totalchaos-retro-gamedata.tgz
        sha256: 0cb7b2bf6606a061c714555e08261e7851a05d04e9e6f5223131c128c4d0439c
      - type: file
        path: com.moddb.TotalChaosRetro.appdata.xml
      - type: file
        path: com.moddb.TotalChaosRetro.desktop
      - type: file
        path: com.moddb.TotalChaosRetro.png
      - type: file
        path: totalchaos.sh
      - type: file
        path: invglow.fp
    build-commands:
      # Patch GZDoom defaults to avoid problems with some GPU drivers
      - sed -i 's/tc_pp_noise=true/tc_pp_noise=false/g' gzdoom_portable.ini
      - sed -i 's/tc_pp_pixelate=true/tc_pp_pixelate=false/g' gzdoom_portable.ini
      - sed -i 's/tc_pp_posterize=true/tc_pp_posterize=false/g' gzdoom_portable.ini
      - sed -i 's/tc_pp_retro=true/tc_pp_retro=false/g' gzdoom_portable.ini
      - sed -i 's/tc_pp_vignette=true/tc_pp_vignette=false/g' gzdoom_portable.ini
      # Patch initial window size which is very small
      - sed -i 's/vid_defheight=480/vid_defheight=600/g' gzdoom_portable.ini
      - sed -i 's/vid_defwidth=640/vid_defwidth=800/g' gzdoom_portable.ini
      # Patch shaders to avoid OpenGL runtime error
      - unzip totalchaos.pk3 SHADERS/old.fp
      - sed -i 's/texture2D/texture/g' SHADERS/old.fp
      - zip -u totalchaos.pk3 SHADERS/old.fp
      # Patch shaders to fix lighting issues
      - cp invglow.fp SHADERS/invglow.fp
      - zip -u totalchaos.pk3 SHADERS/invglow.fp
      # Install files
      - install -Dm 644 totalchaos.pk3 -t /app/share/games/uzdoom
      - install -Dm 644 zd_extra.pk3 -t /app/share/games/uzdoom
      - install -Dm 644 gzdoom_portable.ini -t /app/share/games/uzdoom
      - install -Dm 644 ${FLATPAK_ID}.appdata.xml -t /app/share/appdata
      - install -Dm 644 ${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm 644 ${FLATPAK_ID}.png -t /app/share/icons/hicolor/128x128/apps
      - install -Dm 755 totalchaos.sh -t /app/bin
